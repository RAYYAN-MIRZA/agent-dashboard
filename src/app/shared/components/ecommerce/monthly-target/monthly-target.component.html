
<div class="p-4 bg-white dark:bg-gray-800 rounded-md shadow-sm">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-medium text-gray-800 dark:text-gray-100">Inventory Online Ratio</h3>

    <div class="relative">
      <button (click)="toggleDropdown()" class="text-xs text-gray-500 dark:text-gray-400">Options ▾</button>
      <div *ngIf="isOpen" class="absolute right-0 mt-2 w-40 bg-white dark:bg-gray-700 rounded shadow z-10">
        <button (click)="closeDropdown()" class="w-full text-left px-3 py-2 text-sm text-gray-700 dark:text-gray-200">Refresh</button>
        <button (click)="closeDropdown()" class="w-full text-left px-3 py-2 text-sm text-gray-700 dark:text-gray-200">Export</button>
      </div>
    </div>
  </div>

  <div class="mt-4 flex flex-col items-center">
    <apx-chart
      [series]="series"
      [chart]="chart"
      [plotOptions]="plotOptions"
      [fill]="fill"
      [stroke]="stroke"
      [labels]="labels"
      [colors]="colors"
      class="w-48 h-48"
    ></apx-chart>

    <div class="mt-4 flex items-center space-x-6">
      <div class="text-center">
        <div class="text-xs text-gray-500 dark:text-gray-400">Online</div>
        <div class="text-2xl font-semibold text-green-600 dark:text-green-400">{{ online }}</div>
      </div>

      <div class="text-center">
        <div class="text-xs text-gray-500 dark:text-gray-400">Offline</div>
        <div class="text-2xl font-semibold text-red-600 dark:text-red-400">{{ offline }}</div>
      </div>

      <div class="text-center">
        <div class="text-xs text-gray-500 dark:text-gray-400">Online %</div>
        <div class="text-2xl font-semibold text-gray-800 dark:text-gray-100">{{ onlinePercent }}%</div>
      </div>
    </div>
  </div>
</div>
